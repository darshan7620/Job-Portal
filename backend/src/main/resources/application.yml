spring:
  application:
    name: smart-job-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_job_tracker?createDatabaseIfNotExist=true&serverTimezone=UTC}
    # Dev defaults for local MySQL; override with DB_USERNAME / DB_PASSWORD in any deployment.
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # DEV DEFAULT ONLY. HS256 needs at least 32 bytes. In any real deployment set
    # the JWT_SECRET environment variable to a strong, secret value.
    secret: ${JWT_SECRET:dev-only-smart-job-tracker-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: ${JWT_ISSUER:smart-job-tracker}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    # Local Ollama server; the model must be pulled locally (see README).
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen3:4b}
    connect-timeout: ${OLLAMA_CONNECT_TIMEOUT:5s}
    read-timeout: ${OLLAMA_READ_TIMEOUT:60s}
    max-job-description-length: ${AI_MAX_JOB_DESCRIPTION_LENGTH:4000}
    max-skills: ${AI_MAX_SKILLS:50}
    max-skill-length: ${AI_MAX_SKILL_LENGTH:100}
    # Ask reasoning models for the answer only (no thinking channel).
    think: ${OLLAMA_THINK:false}
    max-output-tokens: ${OLLAMA_MAX_OUTPUT_TOKENS:900}
